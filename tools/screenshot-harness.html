<!doctype html>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>html,body,iframe{margin:0;width:100%;height:100%;border:0;overflow:hidden;background:#f3f8fc}</style>
<iframe id="app" src="/index.html"></iframe>
<script>
const target = new URLSearchParams(location.search).get('screen') || 'welcome';
const frame = document.getElementById('app');
function clickAction(action) { frame.contentDocument.querySelector(`[data-action="${action}"]`)?.click(); }
frame.addEventListener('load', () => {
  setTimeout(() => {
    if (target === 'library') clickAction('library');
    if (target === 'benefits') clickAction('tax-benefits');
    if (target === 'map' || target === 'game') {
      clickAction('profile');
      setTimeout(() => {
        const d = frame.contentDocument;
        d.querySelector('#player-name').value = 'Amina';
        d.querySelector('#gender').value = 'Mwanamke';
        d.querySelector('#profile-form').dispatchEvent(new Event('submit', {bubbles:true,cancelable:true}));
        if (target === 'game') setTimeout(() => clickAction('level-1'), 500);
      }, 300);
    }
  }, 2200);
});
</script>
